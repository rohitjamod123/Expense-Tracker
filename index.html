<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Mini Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #12302f;
            --teal: #0f766e;
            --teal-dark: #0b5a54;
            --saffron: #f59e0b;
            --paper: rgba(255, 255, 255, 0.94);
        }

        body {
            font-family: 'Manrope', system-ui, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            /* Background image with dark overlay; gradient is the fallback if image fails */
            background:
                linear-gradient(rgba(10, 40, 40, 0.72), rgba(10, 40, 40, 0.72)),
                url('https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1600&q=80')
                center / cover fixed no-repeat,
                #0b3d3a;
        }

        .page-title {
            color: #fff;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }
        .page-subtitle { color: #d5ebe8; }

        .panel {
            background: var(--paper);
            border: 0;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }
        .panel-title {
            font-weight: 800;
            color: var(--teal-dark);
            border-left: 5px solid var(--saffron);
            padding-left: 10px;
        }

        .form-label { font-weight: 600; }
        .form-control, .form-select { border-radius: 8px; border-color: #cbd9d7; }
        .form-control:focus, .form-select:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 0.2rem rgba(15, 118, 110, 0.2);
        }

        .btn-main {
            background: var(--teal);
            color: #fff;
            font-weight: 700;
            border: 0;
            border-radius: 8px;
            padding: 10px 18px;
        }
        .btn-main:hover { background: var(--teal-dark); color: #fff; }
        .btn-main.editing { background: var(--saffron); color: #3b2800; }

        .total-box {
            background: var(--ink);
            color: #fff;
            border-radius: 10px;
            padding: 8px 18px;
            font-weight: 800;
            font-size: 1.15rem;
        }
        .total-box span.amt { color: var(--saffron); }

        /* Bootstrap's .table rules override plain selectors, so use higher specificity + !important */
        .table > thead > tr > th {
            background-color: var(--ink) !important;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 8px;
        }
        .table > tbody > tr > td { color: var(--ink); font-size: 1rem; }
        .table > tbody > tr:hover > td { background-color: #eef7f6; }
        .amount-cell { color: #0b5a54 !important; font-weight: 800; font-size: 1.1rem; }

        .cat-badge { font-weight: 600; padding: 6px 10px; border-radius: 20px; color: #fff; }
        .cat-Food { background: #ea580c; }
        .cat-Travel { background: #2563eb; }
        .cat-Shopping { background: #c026d3; }
        .cat-Education { background: #0f766e; }
        .cat-Other { background: #64748b; }

        .empty-row td { padding: 30px 0; color: #6b7f7d; }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 900px;">

        <!-- Title -->
        <div class="text-center mb-4">
            <h1 class="page-title">Expense Tracker System</h1>
            <p class="page-subtitle mb-0">Add, edit and track your daily spending in one place</p>
        </div>

        <!-- Manage Expense (below title) -->
        <div class="panel p-4 mb-4">
            <h5 class="panel-title mb-4">Manage Expense</h5>
            <form id="expenseForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="desc">Description</label>
                        <input type="text" id="desc" class="form-control" placeholder="e.g. Electricity Bill" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="amount">Amount (₹)</label>
                        <input type="number" id="amount" class="form-control" placeholder="e.g. 1500" min="1" step="0.01" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="category">Category</label>
                        <select id="category" class="form-select" required>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="date">Date</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" id="submitBtn" class="btn btn-main flex-grow-1">Add Expense</button>
                        <button type="button" id="cancelBtn" class="btn btn-outline-secondary d-none">Cancel</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Expense Records (below Manage Expense) -->
        <div class="panel p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h5 class="panel-title mb-0">Expense Records</h5>
                <div class="total-box">Total: <span class="amt">₹<span id="totalExpense">0</span></span></div>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered text-center align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript for CRUD Operations -->
    <script>
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
        let editIndex = -1; // Track index for updating records

        const form = document.getElementById('expenseForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        // Default date = today
        function setToday() {
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        }

        // Prevent HTML injection from description text
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderExpenses() {
            const tbody = document.getElementById('expenseTableBody');
            tbody.innerHTML = '';
            let total = 0;

            if (expenses.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No expenses yet. Add your first expense above.</td></tr>';
            }

            expenses.forEach((exp, index) => {
                total += parseFloat(exp.amount);
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-semibold">${escapeHTML(exp.desc)}</td>
                        <td class="fw-bold" style="color:#0f766e;">₹${exp.amount}</td>
                        <td><span class="cat-badge cat-${exp.category}">${exp.category}</span></td>
                        <td>${exp.date}</td>
                        <td>
                            <button class="btn btn-sm btn-warning fw-bold me-1" onclick="editExpense(${index})">Edit</button>
                            <button class="btn btn-sm btn-danger fw-bold" onclick="deleteExpense(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('totalExpense').innerText = total.toFixed(2).replace(/\.00$/, '');
        }

        function resetFormState() {
            editIndex = -1;
            form.reset();
            setToday();
            submitBtn.innerText = "Add Expense";
            submitBtn.classList.remove('editing');
            cancelBtn.classList.add('d-none');
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const newExpense = {
                desc: document.getElementById('desc').value.trim(),
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value
            };

            if (editIndex === -1) {
                expenses.push(newExpense);          // CREATE
            } else {
                expenses[editIndex] = newExpense;   // UPDATE
            }

            localStorage.setItem('expenses', JSON.stringify(expenses));
            resetFormState();
            renderExpenses();                       // READ
        });

        function editExpense(index) {
            document.getElementById('desc').value = expenses[index].desc;
            document.getElementById('amount').value = expenses[index].amount;
            document.getElementById('category').value = expenses[index].category;
            document.getElementById('date').value = expenses[index].date;

            editIndex = index;
            submitBtn.innerText = "Update Expense";
            submitBtn.classList.add('editing');
            cancelBtn.classList.remove('d-none');
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function deleteExpense(index) {
            if (confirm("Are you sure you want to delete this record?")) {
                expenses.splice(index, 1);          // DELETE
                localStorage.setItem('expenses', JSON.stringify(expenses));
                if (editIndex === index) resetFormState();
                renderExpenses();
            }
        }

        cancelBtn.addEventListener('click', resetFormState);

        setToday();
        renderExpenses();
    </script>
</body>
</html>
